# Engagement state: where each agent stage is, and what opened its gate.
# Check with: tools/stagegate.py lint engagement-state.yml
# Before a stage starts: tools/stagegate.py check engagement-state.yml N
# Gates: tools/agent/README.md, "Gates". Rule IDs: tools/stagegate.md.
# Roles, status values and id prefixes: method/records.md.
#
# status:   not_started | draft | handed_over | returned | confirmed
#           The agent may set its own stage to draft or handed_over. Only the lead sets
#           returned or confirmed, by editing this file.
# confirmed: confirmed_by (role or name), confirmed_on (YYYY-MM-DD) and decision_ref (the id
#           of the decision-register entry that records the confirmation), all three.
#           A confirmation is never rewritten; a stage re-opened after it is a new decision.
# reviews:  appended, never edited or removed; a review sets no status.
# recheck:  optional: done, or not_done with recheck_reason, for the sample re-check of the
#           stage's claims by another path before it was confirmed.
# questions: owner questions that block a stage, asked in the format of
#           templates/owner-questions.md. answer_ref is the decision-register id of the
#           answer; absent while the question is open.

# assessment: observability          # or sre; absent means observability

scope:
  decision_ref: "[decision-register id of the agreed scope]"
  access_granted_on: [YYYY-MM-DD]    # read-only access to the code and the client's tools

stages:
  - number: 1                        # Inventory
    status: not_started
    reviews: []
  - number: 2                        # Target model
    status: not_started
    reviews: []
  - number: 3                        # Gap
    status: not_started
    reviews: []
  - number: 4                        # Findings
    status: not_started
    reviews: []
  - number: 5                        # Maturity
    status: not_started
    reviews: []
  - number: 6                        # Recommendations
    status: not_started
    reviews: []

# A confirmed stage, for reference:
#  - number: 1
#    status: confirmed
#    confirmed_by: "[engagement lead]"
#    confirmed_on: [YYYY-MM-DD]
#    decision_ref: "[D-..]"
#    recheck: not_done
#    recheck_reason: "[why not, e.g. confirmed by the owner in one message]"
#    reviews:
#      - {date: [YYYY-MM-DD], by: "[reviewer]", file: "[reviews/stage-1-round-1.md]"}

questions: []

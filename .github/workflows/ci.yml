name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guardrails-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - name: Install tools
        run: scripts/ci-install.sh

      - name: Install Python dependencies
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          export PATH="${RUNNER_TEMP}/venv/bin:${PATH}"
          python -m pip install -r requirements.txt
          echo "${RUNNER_TEMP}/venv/bin" >> "$GITHUB_PATH"
          python -c 'import yaml; print("PyYAML", yaml.__version__)' || {
            echo "yaml cannot be imported" >&2
            exit 1
          }

      - name: Guardrails
        env:
          GUARDRAIL_DENYLIST: ${{ secrets.GUARDRAIL_DENYLIST }}
          # forks get no secrets: pull requests run the public checks, main requires the denylist
          GUARDRAIL_REQUIRE_DENYLIST: ${{ github.event_name == 'push' && '1' || '' }}
        run: scripts/guardrails.sh

      - name: Lint (shellcheck, ruff)
        run: scripts/lint.sh

      - name: Tool tests
        env:
          KIT_REQUIRE_PDF_TOOLS: '1' # a missing PDF tool fails here instead of skipping
        run: scripts/test-tools.sh

      - name: Word delta (informational)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git rev-parse -q --verify "refs/remotes/origin/$BASE_REF" >/dev/null \
            || git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          out=$(scripts/word-delta.sh "origin/$BASE_REF" 2>&1) || true
          printf '%s\n' "$out"
          { echo '### Word delta'; echo; echo '```'; printf '%s\n' "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build PDF
        run: scripts/build.sh

      - name: Guardrails on the built PDF
        env:
          GUARDRAIL_DENYLIST: ${{ secrets.GUARDRAIL_DENYLIST }}
          GUARDRAIL_REQUIRE_DENYLIST: ${{ github.event_name == 'push' && '1' || '' }}
        run: scripts/check-pdf.sh dist/*.pdf

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kit-pdf
          path: dist/*.pdf
          retention-days: 14

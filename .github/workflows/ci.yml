name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guardrails-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - name: Install tools
        run: scripts/ci-install.sh

      - name: Guardrails
        env:
          GUARDRAIL_DENYLIST: ${{ secrets.GUARDRAIL_DENYLIST }}
          # forks get no secrets: pull requests run the public checks, main requires the denylist
          GUARDRAIL_REQUIRE_DENYLIST: ${{ github.event_name == 'push' && '1' || '' }}
        run: scripts/guardrails.sh

      - name: Build PDF
        run: scripts/build.sh

      - name: Guardrails on the built PDF
        env:
          GUARDRAIL_DENYLIST: ${{ secrets.GUARDRAIL_DENYLIST }}
          GUARDRAIL_REQUIRE_DENYLIST: ${{ github.event_name == 'push' && '1' || '' }}
        run: scripts/check-pdf.sh dist/*.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: kit-pdf
          path: dist/*.pdf
          retention-days: 14

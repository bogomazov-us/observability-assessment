name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write # create the release and upload the PDF

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release # add required reviewers on this environment for a manual approval gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Install tools
        run: scripts/ci-install.sh

      - name: Install Python dependencies
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          export PATH="${RUNNER_TEMP}/venv/bin:${PATH}"
          python -m pip install -r requirements.txt
          echo "${RUNNER_TEMP}/venv/bin" >> "$GITHUB_PATH"
          python -c 'import yaml; print("PyYAML", yaml.__version__)' || {
            echo "yaml cannot be imported" >&2
            exit 1
          }

      - name: Guardrails
        env:
          GUARDRAIL_DENYLIST: ${{ secrets.GUARDRAIL_DENYLIST }}
          GUARDRAIL_REQUIRE_DENYLIST: '1'
        run: scripts/guardrails.sh --tag "$GITHUB_REF_NAME"

      - name: Tool tests
        run: scripts/test-tools.sh

      - name: Build PDF
        id: build
        run: echo "pdf=$(scripts/build.sh)" >> "$GITHUB_OUTPUT"

      - name: Guardrails on the built PDF
        env:
          GUARDRAIL_DENYLIST: ${{ secrets.GUARDRAIL_DENYLIST }}
          GUARDRAIL_REQUIRE_DENYLIST: '1'
        run: scripts/check-pdf.sh "${{ steps.build.outputs.pdf }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # A copy under a fixed name, so releases/latest/download/observability-assessment-kit.pdf
        # always serves the newest PDF (the site links to it).
        run: |
          cp "${{ steps.build.outputs.pdf }}" dist/observability-assessment-kit.pdf
          scripts/changelog.sh "$GITHUB_REF_NAME" > dist/notes.md
          gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.pdf }}" dist/observability-assessment-kit.pdf \
            --title "Observability Assessment Kit $GITHUB_REF_NAME" \
            --notes-file dist/notes.md --verify-tag

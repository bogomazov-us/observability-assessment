# Justified exceptions to scripts/consistency.py, one per line:
#   - "check | file | text on the offending line | reason"
# check is weeks, prefix, status, gate or shared. An entry that matches nothing fails the check.
allow:
  - "weeks | method/getting-started.md | the engineer usually from week 1 | staffing (when a role joins), not a step, stage or meeting"
  - "weeks | templates/roadmap.md | M-0 — Blocking decisions | the implementation roadmap's own relative weeks, not the assessment calendar"
